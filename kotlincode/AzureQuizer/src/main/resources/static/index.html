<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC-300 Identity Quiz Sandbox</title>

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col items-center py-12 px-4">

<div class="max-w-2xl w-full space-y-8">

    <header class="text-center">
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">SC-300 Architect Drills</h1>
        <p class="mt-2 text-sm text-gray-600">Stateless Architecture Verification Hub</p>
    </header>

    <div id="navigation-bar" class="grid grid-cols-2 gap-4 sm:grid-cols-4">

        <button hx-get="/quiz/render/identity"
                hx-target="#workspace-slot"
                hx-indicator="#loading-spinner"
                hx-disabled-elt="#navigation-bar button"
                class="p-4 bg-white text-gray-700 rounded-xl shadow-sm border border-gray-200 font-medium hover:border-blue-500 hover:text-blue-600 active:scale-95 disabled:opacity-50 disabled:pointer-events-none transition text-sm">
            Identity Mgmt
        </button>

        <button hx-get="/quiz/render/access"
                hx-target="#workspace-slot"
                hx-indicator="#loading-spinner"
                hx-disabled-elt="#navigation-bar button"
                class="p-4 bg-white text-gray-700 rounded-xl shadow-sm border border-gray-200 font-medium hover:border-blue-500 hover:text-blue-600 active:scale-95 disabled:opacity-50 disabled:pointer-events-none transition text-sm">
            Auth & Access
        </button>

        <button hx-get="/quiz/render/apps"
                hx-target="#workspace-slot"
                hx-indicator="#loading-spinner"
                hx-disabled-elt="#navigation-bar button"
                class="p-4 bg-white text-gray-700 rounded-xl shadow-sm border border-gray-200 font-medium hover:border-blue-500 hover:text-blue-600 active:scale-95 disabled:opacity-50 disabled:pointer-events-none transition text-sm">
            App Access
        </button>

        <button hx-get="/quiz/render/governance"
                hx-target="#workspace-slot"
                hx-indicator="#loading-spinner"
                hx-disabled-elt="#navigation-bar button"
                class="p-4 bg-white text-gray-700 rounded-xl shadow-sm border border-gray-200 font-medium hover:border-blue-500 hover:text-blue-600 active:scale-95 disabled:opacity-50 disabled:pointer-events-none transition text-sm">
            Governance
        </button>
    </div>

    <div id="loading-spinner" class="htmx-indicator mt-4 text-center text-sm font-semibold text-blue-600 animate-pulse">
        Querying Gemini API & rendering secure DOM fragment...
    </div>

    <div id="workspace-slot">
        <div class="p-8 bg-white rounded-xl shadow-md border border-gray-200 text-center text-gray-500">
            Select an SC-300 blueprint focus category above to stream a live verified quiz block scenario.
        </div>
    </div>

</div>

</body>
</html>
